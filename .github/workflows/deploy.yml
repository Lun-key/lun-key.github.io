# Astro 站点部署到 GitHub Pages
# 触发条件：推送到 main 分支，或手动在 GitHub Actions 页面执行
name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main] # 仅监听 main 分支
  workflow_dispatch: # 允许手动触发

# GitHub Pages 需要的权限
permissions:
  contents: read # 读取仓库代码
  pages: write # 写入 Pages 部署产物
  id-token: write # OIDC 身份认证

# 防止并发部署冲突，避免同一时间重复发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建阶段：安装依赖并生成静态站点产物
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取当前仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 安装并配置 Node.js 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # 使用 Node 24
          cache: npm # 启用 npm 缓存，减少重复安装时间

      # 安装项目依赖
      - name: Install dependencies
        run: npm ci

      # 配置 GitHub Pages 相关环境
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 执行 Astro 构建，生成最终静态文件到 dist
      - name: Build
        run: npm run build

      # 上传构建产物，供部署任务使用
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist # 产物目录

  # 部署阶段：将构建产物发布到 GitHub Pages
  deploy:
    environment:
      name: github-pages # GitHub Pages 环境名称
      url: ${{ steps.deployment.outputs.page_url }} # 部署后的访问地址
    runs-on: ubuntu-latest
    needs: build # 等 build 任务成功后再执行
    steps:
      # 发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
